<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lawhi</title>
<meta name="description" content="Écouter le Coran, apprendre à lire et écrire l'arabe, connaître l'histoire de l'islam.">
<meta name="theme-color" content="#231e11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lawhi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Noto+Naskh+Arabic:wght@400;600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Palette « Golden Grove » : bruns et crèmes chauds, de #231E11 à #F5EFD8.
   Mise en page : une colonne calme, des filets plutôt que des cartes, une seule couleur d'accent.
   Les réglages restent cachés derrière des icônes. */
:root {
  --bg: #f5efd8;
  --surface: #fbf7ea;
  --surface-2: #ece2c4;
  --fg: #231e11;
  --muted: #7a6640;
  --faint: #b69a67;
  --line: #e2d5af;
  --accent: #4a3c23;
  --accent-fg: #f5efd8;
  --gold: #7a6640;
  --good: #5b7a3a;
  --bad: #a8432f;
  --font-ui: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-quran: "Amiri Quran", "Noto Naskh Arabic", "Traditional Arabic", serif;
  --font-ar: "Noto Naskh Arabic", "Amiri Quran", "Traditional Arabic", serif;
  --tabbar: 58px;
  --mini: 62px;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #231e11; --surface: #2b2515; --surface-2: #362e1c; --fg: #f5efd8; --muted: #b69a67; --faint: #7a6640;
    --line: #3d3422; --accent: #dcc89a; --accent-fg: #231e11; --gold: #dcc89a; --good: #a9c47f; --bad: #e08a6f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #231e11; --surface: #2b2515; --surface-2: #362e1c; --fg: #f5efd8; --muted: #b69a67; --faint: #7a6640;
  --line: #3d3422; --accent: #dcc89a; --accent-fg: #231e11; --gold: #dcc89a; --good: #a9c47f; --bad: #e08a6f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-ui); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }
.ar { font-family: var(--font-ar); direction: rtl; }
.q { font-family: var(--font-quran); direction: rtl; }
p { margin: 0; }
h2 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.015em; text-wrap: balance; }
h3 { margin: 0; font-size: 15px; font-weight: 700; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }

/* En-tête */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 8px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--bg); }
.brand { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; }
.brand h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
.brand .ar { font-size: 16px; color: var(--gold); }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.icon-btn[aria-expanded="true"] { background: var(--surface-2); color: var(--fg); }
.icon-btn svg { width: 21px; height: 21px; }

main {
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(var(--tabbar) + var(--mini) + env(safe-area-inset-bottom, 0px) + 28px) max(16px, env(safe-area-inset-left, 0px));
  max-width: 680px; margin: 0 auto;
}
.view { display: flex; flex-direction: column; gap: 18px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* Champs et boutons */
.search { width: 100%; padding: 11px 14px; border-radius: 12px; border: 0; background: var(--surface-2); }
.search::placeholder { color: var(--faint); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 12px; background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn svg { width: 17px; height: 17px; }
.btn:disabled { opacity: .5; }
.field { display: flex; flex-direction: column; gap: 6px; }
select { padding: 10px 12px; border-radius: 12px; border: 0; background: var(--surface-2); width: 100%; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 7px 13px; border-radius: 999px; background: var(--surface-2); font-size: 13.5px; font-weight: 600; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

/* Écouter : recherche + engrenage, filtres en texte, liste à filets */
.searchbar { display: flex; gap: 8px; align-items: center; }
.recline { font-size: 12.5px; color: var(--muted); margin-top: -10px; }
.tabs-text { display: flex; gap: 18px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin: 0 -16px; padding: 0 16px; }
.tabs-text::-webkit-scrollbar { display: none; }
.tabs-text button { flex: none; padding: 6px 0 10px; font-size: 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs-text button[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }

.list { display: flex; flex-direction: column; }
.srow { border-bottom: 1px solid var(--line); }
.sline { display: flex; align-items: center; gap: 12px; padding: 11px 0; }
.snum { width: 24px; flex: none; font-size: 12.5px; color: var(--faint); font-variant-numeric: tabular-nums; text-align: right; }
.srow.playing .snum, .srow.playing .smain b { color: var(--accent); }
.smain { flex: 1; min-width: 0; text-align: left; display: flex; flex-direction: column; }
.smain b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
.smain small { color: var(--muted); font-size: 12.5px; }
.mk { display: inline-grid; color: var(--muted); font-style: normal; }
.mk svg { width: 13px; height: 13px; }
.mk.star { color: var(--gold); }
.mk.pct { font-size: 11px; color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.sar { font-family: var(--font-ar); font-size: 19px; color: var(--gold); flex: none; }
.more { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 10px; color: var(--faint); flex: none; }
.more svg { width: 18px; height: 18px; }
.srow.open .more { color: var(--fg); background: var(--surface-2); }
.sacts { display: flex; gap: 6px; padding: 0 0 12px 36px; flex-wrap: wrap; }
.sacts button { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 10px; background: var(--surface-2); font-size: 13px; font-weight: 600; }
.sacts svg { width: 15px; height: 15px; }
.empty { color: var(--muted); padding: 28px 0; text-align: center; }

/* Menu déroulant de l'engrenage */
.gearwrap { position: relative; flex: none; }
.menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; width: min(330px, calc(100vw - 32px));
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 6px 14px;
  box-shadow: 0 14px 40px rgb(0 0 0 / 0.16); display: flex; flex-direction: column;
}
.mrow { display: flex; flex-direction: column; gap: 7px; padding: 11px 0; border-top: 1px solid var(--line); }
.mrow:first-child { border-top: 0; }
.mrow > span, .mrow > label { font-size: 12px; font-weight: 600; color: var(--muted); }
.segm { display: flex; padding: 3px; background: var(--surface-2); border-radius: 10px; gap: 2px; }
.segm button { flex: 1; padding: 7px 4px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.segm button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / 0.1); }

/* Mini lecteur */
.mini {
  position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px)); z-index: 30;
  padding: 0 max(10px, env(safe-area-inset-right, 0px)) 8px max(10px, env(safe-area-inset-left, 0px));
}
.mini-in {
  max-width: 680px; margin: 0 auto; display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; position: relative; overflow: hidden;
  box-shadow: 0 8px 24px rgb(0 0 0 / 0.08);
}
.mini-in .bar { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); width: 0; }
.mini-info { flex: 1; min-width: 0; text-align: left; }
.mini-info b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-info small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .ctl { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; flex: none; }
.mini .ctl svg { width: 22px; height: 22px; }
.mini #miniNext { color: var(--muted); }

/* Onglets du bas */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bg); border-top: 1px solid var(--line);
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.tabs-in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10.5px; font-weight: 600; color: var(--faint); }
.tab svg { width: 22px; height: 22px; }
.tab span { white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--fg); }

/* Feuilles plein écran */
.sheet {
  position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; overscroll-behavior: contain;
  padding: calc(env(safe-area-inset-top, 0px) + 6px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px));
}
.sheet-in { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.sheet-head { display: flex; align-items: center; gap: 8px; position: sticky; top: -6px; background: var(--bg); padding: 6px 0; z-index: 2; }
.sheet-head > div { flex: 1; min-width: 0; text-align: center; }

/* Lecteur */
#playerSheet { overflow: hidden; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
.player { max-width: 680px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; }
.phead { display: flex; align-items: center; gap: 8px; padding: 4px 0 8px; }
.ptitle { flex: 1; min-width: 0; text-align: center; display: flex; flex-direction: column; }
.ptitle b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptitle small { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.pcover { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; min-height: 0; }
.pcover .ar { font-size: clamp(52px, 17vw, 88px); line-height: 1.6; color: var(--gold); }
.pcover .muted { font-size: 13px; }
/* Les versets s'empilent : le dernier en bas, les précédents remontent et s'estompent. */
.feed {
  flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 26px; padding: 24px 2px 18px;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 70px); mask-image: linear-gradient(to bottom, transparent 0, #000 70px);
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }
.feed > :first-child { margin-top: auto; }
.feed .basmala { font-size: 24px; }
.fv { display: flex; flex-direction: column; gap: 8px; opacity: 0.38; transition: opacity .5s ease; }
.fv.now { opacity: 1; animation: rise .5s ease; }
.fv .fk { font-size: 11px; font-weight: 700; color: var(--faint); font-variant-numeric: tabular-nums; }
.fv .q { font-size: clamp(24px, 7vw, 32px); line-height: 2; text-align: right; }
.fv .fr { font-size: 16.5px; line-height: 1.55; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.pbottom { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }
.seek { display: flex; flex-direction: column; gap: 2px; }
.seek input { width: 100%; accent-color: var(--fg); }
.seek .row { justify-content: space-between; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pctl { display: flex; align-items: center; justify-content: center; gap: 36px; }
.pctl button { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; }
.pctl button svg { width: 26px; height: 26px; }
.pctl .big { width: 68px; height: 68px; background: var(--fg); color: var(--bg); }
.pctl .big svg { width: 30px; height: 30px; }
.popts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.popts button { padding: 9px 6px; border-radius: 12px; background: var(--surface-2); font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.popts button small { color: var(--muted); font-weight: 500; font-size: 11.5px; }
.popts button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.popts button[aria-pressed="true"] small { color: inherit; opacity: 0.75; }

/* Lecture du texte */
.basmala { text-align: center; font-family: var(--font-quran); font-size: 26px; color: var(--gold); direction: rtl; line-height: 2; }
.ayah { padding: 18px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.ayah.on { background: var(--surface-2); margin: 0 -12px; padding: 18px 12px; border-radius: var(--r); border-top-color: transparent; }
.ayah .q { font-size: var(--qsize, 30px); line-height: 2.1; text-align: right; }
.ayah .num { display: inline-grid; place-items: center; min-width: 1.6em; height: 1.6em; font-size: 0.55em; border: 1px solid var(--gold); color: var(--gold); border-radius: 50%; margin-inline: 6px; vertical-align: middle; font-family: var(--font-ui); line-height: 1; }
.ayah .tr { color: var(--muted); font-style: italic; font-size: 14px; }
.ayah .fr { font-size: 15px; }
.ayah-tools { display: flex; gap: 6px; }
.ayah-tools button { font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 4px 0; display: inline-flex; gap: 6px; align-items: center; }
.ayah-tools svg { width: 14px; height: 14px; }
.toggles { display: flex; gap: 6px; flex-wrap: wrap; }
.ayah-tools { gap: 16px; }
.ayah-tools [aria-pressed="true"] { color: var(--gold); }
.ayah.marked { box-shadow: inset 3px 0 0 var(--gold); padding-left: 12px; }
.bm { display: inline-flex; align-items: center; gap: 4px; padding: 6px 9px; border-radius: 10px; background: var(--surface-2); font-size: 12px; font-weight: 700; color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
.bm svg { width: 13px; height: 13px; }
.bm.on { color: var(--gold); }
.chip svg { width: 13px; height: 13px; color: var(--gold); }
/* Barre d'écoute qui suit le défilement dans la lecture */
.rbar {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 55;
  display: flex; align-items: center; gap: 4px; padding: 5px 5px 5px 16px; border-radius: 999px;
  background: var(--fg); color: var(--bg); box-shadow: 0 10px 30px rgb(0 0 0 / 0.25); max-width: calc(100% - 32px);
}
.rb-go { font-size: 13.5px; font-weight: 600; white-space: nowrap; padding-right: 6px; font-variant-numeric: tabular-nums; }
.rb-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 14%, transparent); }
.rb-btn svg { width: 20px; height: 20px; }
#readerSheet .sheet-in { padding-bottom: 80px; }
.toggles svg { width: 14px; height: 14px; }

/* Apprendre */
.seg { display: flex; gap: 18px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin: 0 -16px; padding: 0 16px; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; padding: 6px 0 10px; font-size: 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.seg button[aria-selected="true"] { color: var(--fg); border-color: var(--fg); }
.progress-line { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); }
.progress-line .track { flex: 1; height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.progress-line .fill { height: 100%; background: var(--good); }
.letters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; direction: rtl; }
@media (min-width: 520px) { .letters { grid-template-columns: repeat(7, 1fr); } }
.lcell { aspect-ratio: 1; border-radius: var(--r); background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.lcell .ar { font-size: 32px; line-height: 1.3; }
.lcell small { font-size: 10.5px; color: var(--muted); font-family: var(--font-ui); direction: ltr; }
.lcell.m::after { content: ""; position: absolute; top: 8px; left: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--good); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.lhero { display: flex; gap: 16px; align-items: center; }
.lhero .ar { font-size: 68px; line-height: 1.3; color: var(--gold); flex: none; width: 90px; text-align: center; }
.forms { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; direction: rtl; }
.forms div { background: var(--surface-2); border-radius: 12px; padding: 8px 4px; text-align: center; }
.forms .ar { font-size: 30px; line-height: 1.5; display: block; }
.forms small { font-size: 10.5px; color: var(--muted); direction: ltr; display: block; }
.lesson { text-align: left; display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line); width: 100%; }
.lesson .k { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-weight: 700; font-size: 12px; }
.lesson.done .k { background: var(--good); color: #fff; }
.lesson span { flex: 1; font-weight: 600; }
.examples { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; }
.ex { background: var(--surface-2); border-radius: 12px; padding: 10px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
.ex .q { font-size: 28px; line-height: 1.9; }
.ex b { color: var(--accent); font-weight: 600; font-style: italic; }
.ex small { color: var(--muted); font-size: 12px; }
.prose { display: flex; flex-direction: column; gap: 10px; max-width: 65ch; }
.trace-wrap { position: relative; aspect-ratio: 1; width: 100%; max-width: 420px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; touch-action: none; }
.trace-wrap .ghost { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-ar); font-size: min(62vw, 260px); line-height: 1; color: var(--line); pointer-events: none; padding-bottom: 8%; }
.trace-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.trace-wrap .baseline { position: absolute; left: 6%; right: 6%; top: 62%; border-top: 1px dashed var(--line); pointer-events: none; }
.quiz-q { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0; }
.quiz-q .ar { font-size: 84px; line-height: 1.4; }
.quiz-q .big-txt { font-size: 26px; font-weight: 700; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.answers button { padding: 15px 8px; border-radius: var(--r); background: var(--surface-2); border: 1.5px solid transparent; font-weight: 600; font-size: 16px; }
.answers button .ar { font-size: 36px; line-height: 1.3; font-weight: 400; }
.answers button.ok { border-color: var(--good); }
.answers button.ko { border-color: var(--bad); }
.score { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.basics dl { margin: 0; display: grid; grid-template-columns: minmax(90px, auto) 1fr; gap: 8px 14px; }
.basics dt { font-weight: 700; }
.basics dd { margin: 0; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }

/* Histoire */
.timeline { display: flex; flex-direction: column; position: relative; padding-left: 20px; }
.timeline::before { content: ""; position: absolute; left: 4px; top: 8px; bottom: 8px; width: 1px; background: var(--line); }
.ev { position: relative; padding: 0 0 22px; display: flex; flex-direction: column; gap: 3px; }
.ev::before { content: ""; position: absolute; left: -20px; top: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--gold); }
.ev .date { font-size: 12px; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
.ev .date em { font-style: normal; color: var(--muted); font-weight: 500; }
.ev p { max-width: 65ch; color: var(--muted); }
.ev h3 { font-size: 15.5px; }

/* Prières */
.next { display: flex; align-items: center; gap: 14px; padding: 4px 0 2px; }
.next > div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.next b { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.next span:not(.ar) { color: var(--accent); font-weight: 600; font-size: 14px; }
.next .ar { font-size: 30px; color: var(--gold); flex: none; }
.daynav { display: flex; align-items: center; gap: 8px; }
.daynav > div { flex: 1; text-align: center; display: flex; flex-direction: column; }
.daynav small { font-size: 12px; }
.daynav .icon-btn { font-size: 22px; }
.prow { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.prow .pname { flex: 1; font-weight: 600; display: flex; flex-direction: column; }
.prow .pname small { font-weight: 500; font-size: 11.5px; color: var(--muted); }
.prow .ar { font-size: 17px; color: var(--gold); }
.prow b { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }
.prow.sun .pname, .prow.sun b { color: var(--muted); font-weight: 500; }
.prow.past { opacity: 0.45; }
.prow.on b, .prow.on .pname { color: var(--accent); }
.prow.withclock { padding: 8px 0; }
.prow.on .clock circle:first-child { stroke: var(--accent); stroke-width: 3; }
.next.withclock .clock { flex: none; }
.next.withclock b { font-size: 26px; }
.segm svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; }
.wtable { overflow-x: auto; }
.wtable table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.wtable th, .wtable td { padding: 7px 3px; text-align: center; white-space: nowrap; border-top: 1px solid var(--line); }
.wtable thead th { border-top: 0; color: var(--muted); font-size: 11px; font-weight: 600; }
.wtable tbody th { text-align: left; font-weight: 500; color: var(--muted); }
.qibla { display: flex; align-items: center; gap: 16px; }
.qibla .needle { width: 58px; height: 58px; flex: none; border-radius: 50%; border: 1px solid var(--line); position: relative; }
.qibla .needle::before { content: "N"; position: absolute; top: 2px; left: 50%; transform: translateX(-50%); font-size: 9px; font-weight: 700; color: var(--muted); }
.qibla .needle span { position: absolute; left: 50%; top: 8px; bottom: 50%; width: 2px; margin-left: -1px; background: var(--gold); border-radius: 2px; }
.qibla .needle span::after { content: ""; position: absolute; top: -4px; left: 50%; transform: translateX(-50%) rotate(45deg); width: 7px; height: 7px; background: var(--gold); }

/* Réglages et mises à jour */
.gear { position: relative; }
.gear.has-update::after { content: ""; position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px var(--bg); }
.up-row.ready { border-color: var(--accent); }
.notes { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; color: var(--muted); }
.sw-row { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.sw-row span { flex: 1; display: flex; flex-direction: column; font-weight: 600; }
.sw-row small { font-weight: 500; font-size: 12.5px; color: var(--muted); }
.sw-row input { position: absolute; opacity: 0; pointer-events: none; }
.sw-row .sw { width: 44px; height: 26px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.sw-row .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgb(0 0 0 / .2); }
.sw-row input:checked + .sw { background: var(--accent); }
.sw-row input:checked + .sw::after { transform: translateX(18px); }
.sw-row input:focus-visible + .sw { outline: 2px solid var(--accent); outline-offset: 2px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar) + var(--mini) + env(safe-area-inset-bottom, 0px) + 18px); z-index: 60; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 600; max-width: calc(100% - 32px); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
